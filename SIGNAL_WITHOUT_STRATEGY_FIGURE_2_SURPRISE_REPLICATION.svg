<title id="t">Earnings-surprise replication intervals</title>
<desc id="d">Point estimates and bootstrap intervals for two non-overlapping samples, shown separately and never pooled.</desc>
<rect width="1020" height="470" fill="#ffffff"/>
<text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Figure 2. Earnings-surprise replication: MAE difference (baseline minus augmented)</text>
<text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="normal">Positive means adding vendor-defined earnings surprise reduced out-of-sample forecast error.</text>
<text x="40" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="normal">Bars are 95% moving-block bootstrap intervals (2,000 draws, 28-day blocks, seed 20260817).</text>
<text x="40" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="italic">The two samples do not overlap in time and are NOT pooled.</text>
