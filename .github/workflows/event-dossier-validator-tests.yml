name: Event Dossier Validator Tests

# Narrow, deterministic-only CI: discovers and runs EVERY test_*.py file in
# Event_Dossier_Protocol/validator/ -- currently test_validate_event_dossier.py
# (the 66-fixture unit suite) and test_event_dossier_e2e.py (the 6-scenario
# end-to-end suite), and automatically picks up any future validator test
# file without requiring a workflow edit. Never touches live market data,
# GST, Wikipedia, SEC filings, or news sources -- there is no network access
# in this job at all, and the validator itself is statically guarded against
# ever importing one (see
# test_validate_event_dossier.py::test_validator_never_touches_network_or_operational_paths).
on:
  pull_request:
    paths:
      - "Event_Dossier_Protocol/**"
      - ".github/workflows/event-dossier-validator-tests.yml"
  workflow_dispatch: {}

# Least privilege: this job only reads the repository and runs tests. It
# never writes to the repo, never opens issues/PRs, never touches secrets.
permissions:
  contents: read

jobs:
  validator-tests:
    name: Deterministic validator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r Event_Dossier_Protocol/validator/requirements.txt

      - name: Discover and run every validator test file
        working-directory: Event_Dossier_Protocol/validator
        run: |
          set -e
          files=$(ls test_*.py)
          echo "Discovered test files:"
          echo "$files"
          for f in $files; do
            echo "=== Running $f ==="
            python "$f"
          done
