name: Event Dossier Validator Tests

# Narrow, deterministic-only CI: runs ONLY the offline unit tests for
# Event_Dossier_Protocol/validator/validate_event_dossier.py against its
# synthetic fixtures/ directory. Never touches live market data, GST,
# Wikipedia, SEC filings, or news sources -- there is no network access in
# this job at all, and the validator itself is statically guarded against
# ever importing one (see
# test_validate_event_dossier.py::test_validator_never_touches_network_or_operational_paths).
on:
  pull_request:
    paths:
      - "Event_Dossier_Protocol/**"
      - ".github/workflows/event-dossier-validator-tests.yml"
  workflow_dispatch: {}

# Least privilege: this job only reads the repository and runs tests. It
# never writes to the repo, never opens issues/PRs, never touches secrets.
permissions:
  contents: read

jobs:
  validator-tests:
    name: Deterministic validator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r Event_Dossier_Protocol/validator/requirements.txt

      - name: Run deterministic validator tests
        working-directory: Event_Dossier_Protocol/validator
        run: python test_validate_event_dossier.py -v
