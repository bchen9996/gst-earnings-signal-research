<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470" role="img" aria-labelledby="t d">
<title id="t">Leakage correction</title>
<desc id="d">Directional model accuracy, AUC and net return before and after correcting duplicated rows and a same-event lag feature.</desc>
<rect width="1020" height="470" fill="#ffffff"/>
<text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Figure 3. Leakage correction in the directional model</text>
<text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="normal">Before correction: 68 duplicated rows among 285, and a lag feature reading the same event's own outcome.</text>
<text x="40" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="normal">After correction: 217 unique event identities and a corrected feature.</text>
<text x="40" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#d55e00" text-anchor="start" font-weight="bold" font-style="normal">The pre-correction values are INVALIDATED. They are shown only to size the distortion, never as results.</text>
<text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Accuracy</text>
<line x1="70" y1="340" x2="310" y2="340" stroke="#5b5b5b" stroke-width="1"/>
<rect x="100" y="220.00" width="70" height="120.00" fill="none" stroke="#d55e00" stroke-width="2" stroke-dasharray="6,4"/>
<text x="135" y="212.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#d55e00" text-anchor="middle" font-weight="bold" font-style="normal">0.636</text>
<text x="135" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">pre-correction</text>
<text x="135" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">(invalidated)</text>
<rect x="220" y="249.58" width="70" height="90.42" fill="#0072b2"/>
<text x="255" y="241.58490566037736" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#0072b2" text-anchor="middle" font-weight="bold" font-style="normal">0.479</text>
<text x="255" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">corrected</text>
<text x="380" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">AUC</text>
<line x1="380" y1="340" x2="620" y2="340" stroke="#5b5b5b" stroke-width="1"/>
<rect x="410" y="220.00" width="70" height="120.00" fill="none" stroke="#d55e00" stroke-width="2" stroke-dasharray="6,4"/>
<text x="445" y="212.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#d55e00" text-anchor="middle" font-weight="bold" font-style="normal">0.6395</text>
<text x="445" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">pre-correction</text>
<text x="445" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">(invalidated)</text>
<rect x="530" y="252.67" width="70" height="87.33" fill="#0072b2"/>
<text x="565" y="244.66927286942925" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#0072b2" text-anchor="middle" font-weight="bold" font-style="normal">0.4654</text>
<text x="565" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">corrected</text>
<line x1="380" y1="246.18" x2="620" y2="246.18" stroke="#767676" stroke-width="1" stroke-dasharray="4,4"/>
<text x="624" y="250.17670054730257" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#767676" text-anchor="start" font-weight="normal" font-style="normal">chance 0.5</text>
<text x="690" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Direction-only net return</text>
<line x1="690" y1="340" x2="930" y2="340" stroke="#5b5b5b" stroke-width="1"/>
<rect x="720" y="237.54" width="70" height="102.46" fill="none" stroke="#d55e00" stroke-width="2" stroke-dasharray="6,4"/>
<text x="755" y="229.5380674541056" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#d55e00" text-anchor="middle" font-weight="bold" font-style="normal">0.6000%</text>
<text x="755" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">pre-correction</text>
<text x="755" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">(invalidated)</text>
<rect x="840" y="340.00" width="70" height="120.00" fill="#0072b2"/>
<text x="875" y="476.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#0072b2" text-anchor="middle" font-weight="bold" font-style="normal">-0.7027%</text>
<text x="875" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#5b5b5b" text-anchor="middle" font-weight="normal" font-style="normal">corrected</text>
<text x="40" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#5b5b5b" text-anchor="start" font-weight="normal" font-style="normal">Corrected accuracy is below the 0.5347 achieved by always predicting a positive move; corrected AUC is below chance.</text>
</svg>
